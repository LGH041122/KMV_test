<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>index</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f5;--ink:#14171c;--sub:#4b5360;--line:#d5d9e0;--acc:#1d4ed8;--d:#b42318;--db:#fde7e4;--ok:#05603a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Nanum Gothic',system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:1.9rem;font-weight:800;margin:4px 0 0;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:800;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--sub);margin:0 0 14px}.muted{color:var(--sub);font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;font-size:16px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
label{display:block;font-size:.85rem;font-weight:700;color:var(--sub);margin:12px 0 4px}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel p{margin:0 0 12px}
.btn{border:0;background:var(--acc);color:#fff;font-weight:800;min-height:46px;padding:10px 20px;border-radius:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.dang{background:var(--d)}.btn.sm{min-height:44px;padding:8px 16px}
.btn:disabled{opacity:.4;cursor:default}
.link{border:0;background:none;color:var(--acc);font-weight:800;font-size:.88rem;padding:8px 6px}
.link.danger{color:var(--d)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:1.7rem;line-height:1.1}.stats span{font-size:.78rem;color:var(--sub);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;min-height:38px;padding:4px 12px;font-size:.86rem;font-weight:700}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}.chip small{color:var(--sub)}
.inline{display:flex;gap:8px;margin-top:10px}.inline input{flex:1}
.row{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.row span{grid-column:1/-1;color:var(--sub);font-size:.88rem}.row em{font-style:normal;font-size:.75rem;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:28px 0}
.bar{display:flex;gap:6px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.bar select{flex:1;min-width:0}
.icon{flex:none;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;display:grid;place-items:center}
svg.s{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene{perspective:1200px;margin:10px 0 12px}
.card{position:relative;height:min(62vh,440px);min-height:330px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;background:#fff;border:1.5px solid var(--line);border-top:8px solid var(--c);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.back{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;text-align:left;overflow:auto}
.art{height:130px;display:grid;place-items:center}.art img{max-height:130px;max-width:100%;border-radius:12px;object-fit:contain}
.en{font-size:2rem;font-weight:800;margin:0;word-break:break-word;line-height:1.2}
.tagb{font-size:.78rem;font-weight:800;color:var(--c);background:#fff;border:1.5px solid var(--c);border-radius:6px;padding:0 10px}
.face small{color:var(--sub);font-size:.78rem}
.back .ko{font-size:1.5rem;font-weight:800;margin:0 0 6px}.back p{margin:0 0 8px}
.cn .old{border:1.5px dashed #6b7280;color:#6b7280;padding:0 8px;border-radius:6px;text-decoration:line-through}
.cn .new{background:var(--ink);color:#fff;padding:0 9px;border-radius:6px;font-weight:800}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}.pager .btn{flex:1}.pager span{font-weight:800;min-width:70px;text-align:center}
.tools2{display:flex;justify-content:center;gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.ico{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}.ico.on{border-color:var(--ink);border-width:3px}
.bmrow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:8px 8px 8px 10px;margin-bottom:8px}
.bmrow div{flex:1;min-width:0}.bmrow b{display:block}.bmrow small{color:var(--sub)}
.warn{margin-top:12px;padding:10px 12px;border:1.5px solid var(--d);background:var(--db);color:var(--d);font-weight:700;border-radius:10px;font-size:.9rem}
.prev{max-height:120px;border-radius:10px;margin-top:8px;display:block}
.actions{display:flex;gap:8px;margin:14px 0 0!important}.actions .btn{flex:1}
.foot{text-align:center;margin-top:20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:1.5px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:160px;min-height:54px;border:0;background:none;font-size:.74rem;font-weight:800;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px}
nav button.on{color:var(--acc);background:#e3ebff}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(20,23,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sh p{margin:0 0 4px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}

   <input name="newbm" placeholder="새 책갈피 이름" maxlength="20" hidden style="margin-top:8px" aria-label="새 책갈피 이름">
   <label for="fen">단어 (영어)</label><input id="fen" name="en" required value="${esc(e?e.en:'')}" placeholder="예: Pneumonia" autocapitalize="off" autocorrect="off" spellcheck="false">
   <label for="fde">설명</label><textarea id="fde" name="desc" rows="5" required placeholder="첫 줄: 한글 뜻 (예: 폐렴)&#10;다음 줄부터: 자세한 설명">${esc(e?e.desc:'')}</textarea>
   <label for="fdt">등록일</label><input id="fdt" type="date" name="date" value="${e?e.date:ymd()}" required>
   <label for="fim">삽화 (선택)</label><input id="fim" type="file" name="img" accept="image/*"><div id="imgprev"></div>
   <div class="warn" id="warn" role="alert" hidden></div>
   <p class="actions"><button class="btn">${e?'수정 저장':'등록하기'}</button>${e?'<button type="button" class="btn ghost" data-act="cancel">취소</button>':''}</p></form>`;
  prev()}
function prev(){$('#imgprev').innerHTML=V.img?`<img class="prev" src="${V.img}" alt="선택한 삽화"><button type="button" class="link danger" data-act="rmimg">사진 지우기</button>`:'<small class="muted">사진이 없으면 책갈피 일러스트가 표시돼요.</small>'}
function warn(m){const w=$('#warn');w.textContent=m;w.hidden=false}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function saveword(f){
  const fd=new FormData(f);let bm=fd.get('bm');
  const en=String(fd.get('en')).replace(/\s+/g,' ').trim(),desc=String(fd.get('desc')).trim().replace(/\n{3,}/g,'\n\n');
  if(!/^[A-Za-z][A-Za-z0-9'’()\/.,&\- ]*$/.test(en)||!/[a-z]{2}/i.test(en))return warn('영어 단어를 알파벳으로 입력해 주세요.');
  if(!desc)return warn('설명을 입력해 주세요.');
  const n=norm(en),others=S.words.filter(w=>w.id!==V.editW);
  const same=others.find(w=>norm(w.en)===n);if(same)return warn(`이미 등록된 단어예요: ${same.en}`);
  if(!V.confirmed){
    const near=others.find(w=>{const m=norm(w.en);return n.length>=5&&Math.abs(m.length-n.length)<=2&&dist(n,m)<=(n.length>=9?2:1)});
    if(near){V.confirmed=true;return warn(`"${near.en}"와 철자가 비슷해요. 오타인지 확인하고, 맞다면 한 번 더 눌러 등록하세요.`)}}
  if(bm==='__new'){const nm=String(fd.get('newbm')).trim();if(!nm)return warn('새 책갈피 이름을 입력해 주세요.');bm=addBm(nm)}
  const rec={bm,en:cap(en),desc,date:fd.get('date')||ymd(),img:V.img};
  if(V.editW)Object.assign(S.words.find(w=>w.id===V.editW),rec);else S.words.push({id:'w'+Date.now(),t:Date.now(),...rec});
  if(!persist()){if(!V.editW)S.words.pop();return}
  V.lastBm=bm;V.confirmed=false;
  if(V.editW){const id=V.editW;V.editW=null;A.openword({id})}else{V.img='';toast(`"${rec.en}" 등록했어요`);addv()}}

function bmv(){
  const e=V.editB?S.bms.find(b=>b.id===V.editB):null,pk=V.pick,nm=V.bmName!==null?V.bmName:(e?e.name:'');
  $('#v-bm').innerHTML=`<h1>책갈피</h1><p class="sub">단어를 계통·주제별로 나누어 관리해요.</p>
  <form class="panel" data-sub="savebm" autocomplete="off"><label style="margin-top:0" for="bn">${e?'책갈피 수정':'새 책갈피'}</label><input id="bn" name="n" required maxlength="20" value="${esc(nm)}" placeholder="예: 생식기계">
   <label>색깔</label><div class="sw">${COLORS.map(c=>`<button type="button" class="swatch ${c===pk.color?'on':''}" data-act="pcolor" data-c="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')}</div>
   <label>아이콘</label><div class="sw">${Object.keys(ICONS).map(k=>`<button type="button" class="ico ${k===pk.icon?'on':''}" data-act="picon" data-k="${k}" aria-label="아이콘 ${k}">${svg(k,pk.color,32)}</button>`).join('')}</div>
   <p class="actions"><button class="btn">${e?'저장':'추가'}</button>${e?'<button type="button" class="btn ghost" data-act="cancelbm">취소</button>':''}</p></form>
  ${S.bms.map(b=>`<div class="bmrow" style="--c:${b.color}">${svg(b.icon,b.color,36)}<div><b>${esc(b.name)}</b><small>${cnt(b.id)}개 단어</small></div><button class="link" data-act="openbm" data-id="${b.id}">열기</button><button class="link" data-act="editbm" data-id="${b.id}">수정</button><button class="link danger" data-act="delbm" data-id="${b.id}">삭제</button></div>`).join('')}
  <p class="foot"><button class="link danger" data-act="reset">처음 상태로 초기화</button></p>`}
const keepName=()=>{const i=$('#v-bm [name=n]');if(i)V.bmName=i.value};

const A={
 go:d=>go(d.v),
 openbm:d=>{V.bm=d.id;V.sort='bm';V.i=0;V.flip=false;go('study')},
 openword:d=>{V.bm='all';V.sort='date';V.flip=false;V.i=Math.max(0,deck().findIndex(x=>x.id===d.id));go('study')},
 flip:()=>{const c=$('.card');if(c){c.classList.toggle('flip');V.flip=c.classList.contains('flip')}},
 prev:()=>{if(V.i>0){V.i--;V.flip=false;study()}},
 next:()=>{if(V.i<deck().length-1){V.i++;V.flip=false;study()}},
 tts:speak,
 editw:d=>{const w=S.words.find(x=>x.id===d.id);V.editW=d.id;V.img=w.img||'';V.confirmed=false;go('add',true)},
 delw:d=>{const w=S.words.find(x=>x.id===d.id);sheet(`"${w.en}" 삭제`,'이 단어를 삭제할까요?',[{l:'삭제',c:'dang',f:()=>{S.words=S.words.filter(x=>x.id!==d.id);persist();V.flip=false;study()}},{l:'취소',c:'ghost'}])},
 cancel:()=>{V.editW=null;go('study')},
 rmimg:()=>{V.img='';prev()},
 pcolor:d=>{keepName();V.pick.color=d.c;bmv()},
 picon:d=>{keepName();V.pick.icon=d.k;bmv()},
 editbm:d=>{const b=S.bms.find(x=>x.id===d.id);V.editB=d.id;V.bmName=null;V.pick={color:b.color,icon:b.icon};bmv();window.scrollTo(0,0)},
 cancelbm:()=>{V.editB=null;V.bmName=null;V.pick={color:COLORS[0],icon:'book'};bmv()},
 delbm:d=>{
  const b=S.bms.find(x=>x.id===d.id),n=cnt(d.id);
  const rm=()=>{S.bms=S.bms.filter(x=>x.id!==d.id);if(V.bm===d.id)V.bm='all';persist();bmv()};
  if(!n)return sheet(`'${b.name}' 삭제`,'이 책갈피를 삭제할까요?',[{l:'삭제',c:'dang',f:rm},{l:'취소',c:'ghost'}]);
  sheet(`'${b.name}' 삭제`,`이 책갈피에 단어 ${n}개가 있어요. 어떻게 할까요?`,[
   {l:'단어도 함께 삭제',c:'dang',f:()=>{S.words=S.words.filter(w=>w.bm!==d.id);rm()}},
   {l:"단어는 '미분류'로 이동",f:()=>{const u=addBm('미분류','#374151','book');S.words.forEach(w=>{if(w.bm===d.id)w.bm=u});rm()}},
   {l:'취소',c:'ghost'}])},
 reset:()=>sheet('처음 상태로 초기화','직접 등록한 단어와 책갈피가 모두 사라지고 기본 단어 목록으로 돌아가요.',[{l:'초기화',c:'dang',f:()=>{S=seed();V=V0();persist();go('home')}},{l:'취소',c:'ghost'}])
};
const SUB={
 quickbm:f=>{const n=f.elements.n.value.trim();if(!n)return;addBm(n);toast(`"${n}" 책갈피를 만들었어요`);home()},
 saveword,
 savebm:f=>{
  const n=f.elements.n.value.trim();if(!n)return;
  const dup=S.bms.find(b=>b.name===n&&b.id!==V.editB);if(dup)return toast('같은 이름의 책갈피가 있어요.');
  if(V.editB){Object.assign(S.bms.find(b=>b.id===V.editB),{name:n,color:V.pick.color,icon:V.pick.icon})}else addBm(n,V.pick.color,V.pick.icon);
  persist();toast('저장했어요');V.editB=null;V.bmName=null;V.pick={color:COLORS[0],icon:'book'};bmv()}};

document.addEventListener('click',e=>{
  const sh=e.target.closest('[data-sh]');
  if(sh){const s=$('#sheet'),b=s._b[+sh.dataset.sh];s.hidden=true;if(b.f)b.f();return}
  if(e.target.id==='sheet'){e.target.hidden=true;return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(SUB[f.dataset.sub])SUB[f.dataset.sub](f)});
document.addEventListener('input',e=>{if(e.target.name==='en'){V.confirmed=false;const w=$('#warn');if(w)w.hidden=true}});
document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset.chg;
  if(k==='bm'||k==='sort'){V[k]=t.value;V.i=0;V.flip=false;study()}
  else if(k==='bmsel'){const n=$('#v-add [name=newbm]');n.hidden=t.value!=='__new';if(!n.hidden)n.focus()}
  else if(t.name==='img'&&t.files[0]){
    try{V.img=await shrink(t.files[0]);prev()}catch(_){warn('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.')}}});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;
  if(V.tab==='study'){if(e.key==='ArrowRight')A.next();else if(e.key==='ArrowLeft')A.prev()}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();A.flip()}});
let x0=null;
const vs=$('#v-study');
vs.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
vs.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60)dx<0?A.next():A.prev()});
go('home');
</script>
</body>
</html>
